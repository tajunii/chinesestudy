<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중국어 여행 회화 TV 앱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* TV 화면용 스크롤바 */
        ::-webkit-scrollbar { width: 20px; height: 20px; }
        ::-webkit-scrollbar-track { background-color: #0f172a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background-color: #ffb703; border-radius: 10px; border: 4px solid #0f172a; }
        ::-webkit-scrollbar-thumb:hover { background-color: #ffeb3b; }
        html { scrollbar-color: #ffb703 #0f172a; scrollbar-width: auto; }

        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: 'Noto Sans KR', sans-serif; 
            margin: 0;
            overflow-x: hidden;
        }

        .zh-text { font-family: 'Noto Sans SC', sans-serif; }

        /* 상단 네비게이션 (모드 전환) */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        .tab-btn {
            font-size: 1.5rem;
            padding: 15px 40px;
            border-radius: 50px;
            background-color: #334155;
            color: #94a3b8;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }
        .tab-btn.active {
            background-color: #1e293b;
            color: #fbbf24;
            border-color: #fbbf24;
        }
        .tab-btn:focus, .tab-btn:hover {
            outline: none;
            background-color: #475569;
            color: white;
            transform: scale(1.05);
        }

        /* ---------------- 예습(쉐도잉) 모드 스타일 ---------------- */
        .sentence-box { 
            display: flex; flex-direction: column; gap: 10px; padding: 1.5rem; 
            background-color: #1e293b; border-radius: 1rem; 
            border: 4px solid transparent; 
            transition: all 0.2s ease;
            margin-bottom: 1.5rem;
        }
        .sentence-box.focused {
            border-color: #ffb703;
            background-color: #2a3b54;
            transform: scale(1.02);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .cn-main { font-size: 2.5rem; font-weight: bold; color: #ffffff; }
        .pinyin { font-size: 1.5rem; color: #fbbf24; margin-bottom: 5px; }
        .kr-trans { font-size: 1.4rem; color: #cbd5e1; }
        
        /* ---------------- 퀴즈 모드 스타일 ---------------- */
        .quiz-container {
            width: 1000px; max-width: 90vw; margin: 0 auto;
            background: #1e293b; padding: 60px; border-radius: 2rem;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #q-kr { font-size: 3rem; color: #fbbf24; font-weight: bold; min-height: 120px; display: flex; align-items: center; justify-content: center; word-break: keep-all;}
        #q-answer { display: none; margin-top: 40px; animation: fadeIn 0.3s; }
        #q-answer.reveal { display: block; }
        #q-cn { font-size: 4rem; font-weight: bold; color: #ffffff; line-height: 1.2; margin-bottom: 15px;}
        #q-pinyin { font-size: 2rem; color: #93c5fd; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .btn-large {
            margin-top: 30px; font-size: 1.8rem; font-weight: bold;
            padding: 20px 50px; border: none; border-radius: 50px; cursor: pointer;
            background-color: #ffffff; color: #0f172a; transition: all 0.2s;
        }
        .btn-large:focus, .btn-large:hover {
            outline: 6px solid #fbbf24; outline-offset: 4px; background-color: #e2e8f0; transform: scale(1.05);
        }
        
        #eval-btns { display: none; gap: 80px; justify-content: center; margin-top: 40px; }
        .eval-btn { font-size: 1.5rem; padding: 20px 40px; border-radius: 50px; font-weight: bold; border: none; cursor: pointer; transition: transform 0.2s; color: white;}
        #btn-easy { background-color: #3b82f6; }
        #btn-easy:focus, #btn-easy:hover { outline: 5px solid #93c5fd; background-color: #2563eb; transform: scale(1.1); }
        #btn-hard { background-color: #f97316; }
        #btn-hard:focus, #btn-hard:hover { outline: 5px solid #fdba74; background-color: #ea580c; transform: scale(1.1); }

        #progress-bar { font-size: 1.5rem; display: flex; justify-content: center; gap: 30px; background: rgba(255,255,255,0.05); padding: 15px 30px; border-radius: 20px; display: inline-flex; margin-bottom: 30px;}
        .stat-master { color: #86efac; font-weight: bold; }
        .stat-count { color: #93c5fd; font-weight: bold; }

        /* 공통 헤더 */
        .top-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; }
        #homeBtn { font-size: 2rem; background: transparent; border: none; cursor: pointer; color: white; transition: transform 0.2s;}
        #homeBtn:hover, #homeBtn:focus { transform: scale(1.2); outline: none; }
    </style>
</head>
<body>

    <div class="top-header">
        <h1 class="text-4xl font-bold text-slate-300">베이징 여행 중국어</h1>
        <button id="homeBtn" title="홈으로">🏠</button>
    </div>

    <!-- 탭 메뉴 -->
    <div class="nav-tabs">
        <button id="tab-preview" class="tab-btn active">📖 문장 예습 (쉐도잉)</button>
        <button id="tab-quiz" class="tab-btn">🎯 실전 퀴즈</button>
    </div>

    <!-- 1. 예습 모드 영역 -->
    <div id="view-preview" class="max-w-5xl mx-auto p-4 w-full">
        <div id="preview-list" class="pb-32">
            <p class="text-center text-xl mt-10 text-yellow-400">데이터를 불러오는 중입니다...</p>
        </div>
    </div>

    <!-- 2. 퀴즈 모드 영역 -->
    <div id="view-quiz" class="w-full flex-1 flex flex-col items-center justify-center hidden pt-10 pb-20">
        <div class="quiz-container">
            <div id="progress-bar"></div>
            <div id="q-kr">문제를 불러오는 중입니다...</div>
            
            <button id="btn-show-answer" class="btn-large">정답 확인</button>
            
            <div id="q-answer">
                <div id="q-cn" class="zh-text"></div>
                <div id="q-pinyin"></div>
            </div>

            <div id="eval-btns">
                <button id="btn-easy" class="eval-btn">쉬움 (외움)</button>
                <button id="btn-hard" class="eval-btn">어려움 (다시)</button>
            </div>
            
            <div class="mt-12 text-right border-t border-slate-700 pt-4">
                <select id="categorySelect" class="bg-slate-800 text-white px-4 py-2 rounded text-lg border border-slate-600 outline-none mr-4">
                    <option value="all">전체 상황</option>
                </select>
                <button id="btn-reset" class="text-slate-400 hover:text-white underline text-lg bg-transparent border-none cursor-pointer">진도 초기화</button>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
    // ---------------------------------------------------------
    // 1. 공통 데이터 및 설정
    // ---------------------------------------------------------
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRTUWrzsscnZ3sHRvSenqLY4o1c-mkvZLYV9GDTdhjvwkyBI7AYjkIRGFKX3Qjdftb7NL5m6HGnAYwS/pub?gid=1532593803&single=true&output=csv";
    const AUDIO_BASE_URL = "audio/"; 
    
    let db = [];
    let currentMode = 'preview'; 
    let currentAudio = new Audio();

    // ---------------------------------------------------------
    // 2. CSV 데이터 안정적인 로드 (PapaParse 직접 다운로드 방식)
    // ---------------------------------------------------------
    function loadData() {
        document.getElementById("preview-list").innerHTML = "<p class='text-center text-xl mt-10 text-yellow-400'>데이터를 불러오는 중입니다...</p>";
        
        Papa.parse(SHEET_URL, {
            download: true,
            header: false,
            skipEmptyLines: true,
            complete: function(result) {
                if (result.data.length > 0 && result.data[0][0] && result.data[0][0].includes("<!DOCTYPE html>")) {
                    showError("구글 시트가 <b>'웹에 게시'</b> 되지 않았습니다.<br>[파일 -> 공유 -> 웹에 게시]를 확인해주세요.");
                    return;
                }

                const rows = result.data.slice(1);
                db = rows.map(cols => ({
                    id: cols[0]?.trim() || "",
                    category: cols[1]?.trim() || "",
                    cn: cols[2]?.trim() || "",
                    pinyin: cols[3]?.trim() || "",
                    kr: cols[4]?.trim() || "",
                    audioFile: cols[5]?.trim() || "",
                    hangul: cols[6]?.trim() || "" 
                })).filter(item => item.cn && item.kr);

                if(db.length > 0) {
                    initPreviewMode();
                    initQuizMode();
                } else {
                    showError("데이터를 찾을 수 없습니다.<br>시트에 데이터가 올바르게 입력되어 있는지 확인해주세요.");
                }
            },
            error: function(err)
